name: reminders

on:
  schedule:
    - cron: '2 * * * *'   # every hour at minute 2 (UTC); the script itself only sends in each user's own 3-hour slots
  workflow_dispatch:       # run it by hand from the Actions tab
    inputs:
      force:
        description: 'Send now even if it is not a reminder hour (for testing)'
        type: boolean
        default: false

concurrency:
  group: yommy-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin@12 --no-save --no-audit --no-fund
      - run: node scripts/send-reminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ inputs.force }}
