name: Yommy reminders

on:
  schedule:
    - cron: '7 * * * *'   # every hour at minute 7 (UTC); the script only sends in each user's own 3-hour slots
  workflow_dispatch:       # lets you run it by hand from the Actions tab
    inputs:
      force:
        description: 'Send now even if it is not a reminder hour (for testing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yommy-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Send reminders
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ inputs.force }}
        run: node send-reminders.js
